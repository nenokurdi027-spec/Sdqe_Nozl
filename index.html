<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سیستەمی بەڕێوەبردنی نۆزڵ</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#18263d;--text:#eef4ff;--muted:#a9b8ce;--line:#2b3c56;--accent:#4f8cff;--green:#24b47e;--red:#ef5350;--gold:#f6bd4b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#172b48 0,#0b1220 58%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;padding:22px}
.container{max-width:1000px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:clamp(23px,4vw,34px);margin:0 0 7px}
.subtitle{color:var(--muted);margin:0;line-height:1.7}
.pill{border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:#d7e5ff;background:#101b2c;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
.card{background:rgba(18,29,48,.96);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 32px #0002}
h2{font-size:20px;margin:0 0 15px}
label{display:block;font-size:14px;color:#cfdaeb;margin:12px 0 7px}
input,textarea{width:100%;border:1px solid #344966;background:#0b1525;color:var(--text);padding:13px 14px;border-radius:11px;font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4f8cff24}
textarea{resize:vertical;min-height:95px}
button{border:0;border-radius:11px;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s}
button:active{transform:scale(.98)}
.primary{background:var(--accent);color:white;width:100%;margin-top:15px}
.secondary{background:#253650;color:#e7efff}
.danger{background:#47242c;color:#ffb7b7}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.tools button{flex:1}
.searchbar{display:flex;gap:9px;margin-bottom:13px}
.searchbar input{flex:1;min-width:0}
.stats{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;margin:5px 0 12px}
.entries{display:grid;gap:10px}
.entry{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:14px}
.entry-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.code{font-size:18px;font-weight:800;letter-spacing:.4px;direction:ltr;unicode-bidi:isolate;display:inline-block}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;color:#d7e1f0;line-height:1.65;margin-top:6px}
.entry-actions{display:flex;gap:7px;margin-top:11px}
.entry-actions button{padding:8px 11px;font-size:13px}
.empty{border:1px dashed #3b4e68;border-radius:13px;text-align:center;padding:26px 12px;color:var(--muted);line-height:1.8}
.notice{display:none;margin:0 0 14px;padding:11px 13px;border-radius:10px;line-height:1.6}
.notice.show{display:block}.notice.ok{background:#143b31;color:#a9f5d5}.notice.err{background:#44252b;color:#ffc0c0}
.foot{color:var(--muted);font-size:12px;line-height:1.7;margin-top:18px}
@media(max-width:760px){body{padding:13px}.grid{grid-template-columns:1fr}.card{padding:16px}header{align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
<header>
  <div>
    <h1>🔧 سیستەمی نۆزڵ</h1>
    <p class="subtitle">زیادکردن، گەڕان، سڕینەوە و بەڕێوەبردنی لیستی نۆزڵەکان</p>
  </div>
  <div class="pill">📦 ژمارەی نۆزڵەکان: <strong id="totalTop">0</strong></div>
</header>

<div id="notice" class="notice" role="status" aria-live="polite"></div>

<div class="grid">
  <section class="card">
    <h2>➕ زیادکردنی نۆزڵ</h2>
    <form id="addForm">
      <label for="code">کۆدی نۆزڵ (تەنیا A-Z و 0-9)</label>
      <input id="code" name="code" autocomplete="off" placeholder="نموونە: P307" required pattern="[A-Za-z0-9]+" title="تەنیا حەرفی ئینگلیزی و ژمارە" />
      <label for="description">وەسفی نۆزڵ</label>
      <textarea id="description" name="description" placeholder="وەسفی نۆزڵ بنووسە..." required></textarea>
      <button class="primary" type="submit">💾 خەزنکردنی نۆزڵ</button>
    </form>
    <div class="tools">
      <button class="secondary" id="exportBtn" type="button">⬇️ دەرکردنی لیست (JSON)</button>
      <button class="secondary" id="importBtn" type="button">⬆️ هێنانەوەی لیست</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
    <p class="foot">داتا لەم وێبگەڕەدا خەزن دەبێت. بۆ پاراستنی لیستەکەت، بە شێوەی JSON دەرگیری بکە و لە شوێنێکی پارێزراو بیپارێزە.</p>
  </section>

  <section class="card">
    <h2>🔎 گەڕان لە لیست</h2>
    <label for="search">تەنیا کۆدی نۆزڵ بنووسە</label>
    <div class="searchbar">
      <input id="search" autocomplete="off" placeholder="نموونە: P307" />
      <button class="secondary" id="clearSearch" type="button">پاککردنەوە</button>
    </div>
    <div class="stats"><span id="resultCount">0 ئەنجام</span><span>گەڕان بە کۆد</span></div>
    <div id="entries" class="entries"></div>
  </section>
</div>
</div>

<script>
(() => {
  const STORAGE_KEY = "nozl_list_v2";
  const $ = (id) => document.getElementById(id);
  let items = loadItems();

  function loadItems() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(x => x && typeof x.code === "string" && typeof x.description === "string") : [];
    } catch { return []; }
  }

  function saveItems() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    render();
  }

  function normalizeCode(value) { return value.trim().toUpperCase(); }
  function validCode(value) { return /^[A-Z0-9]+$/.test(value); }

  function showNotice(text, type="ok") {
    const n = $("notice");
    n.textContent = text;
    n.className = "notice show " + type;
    window.clearTimeout(showNotice.timer);
    showNotice.timer = window.setTimeout(() => n.className = "notice", 4500);
  }

  function render() {
    const query = normalizeCode($("search").value);
    $("totalTop").textContent = items.length;

    const container = $("entries");
    container.replaceChildren();

    // If search box is empty, don't show any items in the bottom list
    if (!query) {
      $("resultCount").textContent = "0 ئەنجام";
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "🔍 بۆ پیشاندانی نۆزڵ، کۆدەکەی لە خانەی گەڕان لە سەرەوە بنووسە.";
      container.appendChild(empty);
      return;
    }

    const filtered = items.filter(item => item.code.includes(query));
    $("resultCount").textContent = `${filtered.length} ئەنجام`;

    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = `❌ نۆزڵی ${query} لە لیستدا نەدۆزرایەوە.`;
      container.appendChild(empty);
      return;
    }

    filtered.forEach(item => {
      const article = document.createElement("article");
      article.className = "entry";
      
      const top = document.createElement("div"); 
      top.className = "entry-top";
      
      const codeSpan = document.createElement("span"); 
      codeSpan.className = "code"; 
      codeSpan.textContent = item.code;
      
      const status = document.createElement("span"); 
      status.textContent = "✅ هەیە"; 
      status.style.color = "var(--green)";
      
      top.append(codeSpan, status);

      const desc = document.createElement("div"); 
      desc.className = "desc"; 
      desc.textContent = item.description;

      const actions = document.createElement("div"); 
      actions.className = "entry-actions";
      
      const edit = document.createElement("button"); 
      edit.className = "secondary"; 
      edit.textContent = "✏️ دەستکاریکردن";
      edit.addEventListener("click", () => editItem(item.code));
      
      const del = document.createElement("button"); 
      del.className = "danger"; 
      del.textContent = "🗑️ سڕینەوە";
      del.addEventListener("click", () => deleteItem(item.code));
      
      actions.append(edit, del);
      article.append(top, desc, actions);
      container.appendChild(article);
    });
  }

  $("addForm").addEventListener("submit", event => {
    event.preventDefault();
    const code = normalizeCode($("code").value);
    const description = $("description").value.trim();

    if (!validCode(code)) return showNotice("⚠️ کۆد دەبێت تەنیا حەرفی ئینگلیزی و ژمارە بێت.", "err");
    if (!description) return showNotice("⚠️ تکایە وەسفی نۆزڵ بنووسە.", "err");

    const index = items.findIndex(item => item.code === code);

    if (index >= 0) {
      if (!confirm(`کۆدی ${code} پێشتر هەیە. دەتەوێت وەسفەکەی نوێ بکەیتەوە؟`)) return;
      items[index] = { code, description };
      showNotice(`✅ زانیاری نۆزڵی ${code} نوێ کرایەوە.`);
    } else {
      items.push({ code, description });
      showNotice(`✅ نۆزڵی ${code} خەزن کرا.`);
    }

    saveItems();
    $("addForm").reset();
    $("search").value = code;
    render();
  });

  function deleteItem(code) {
    if (!confirm(`دڵنیایت نۆزڵی ${code} بسڕیتەوە؟`)) return;
    items = items.filter(x => x.code !== code);
    saveItems();
    showNotice(`🗑️ نۆزڵی ${code} سڕایەوە.`);
  }

  function editItem(code) {
    const item = items.find(x => x.code === code);
    if (!item) return;

    const newCodeRaw = prompt("کۆدی نۆزڵ:", item.code);
    if (newCodeRaw === null) return;
    const newCode = normalizeCode(newCodeRaw);
    if (!validCode(newCode)) return showNotice("⚠️ کۆد دەبێت تەنیا A-Z و 0-9 بێت.", "err");

    const newDescription = prompt("وەسفی نۆزڵ:", item.description);
    if (newDescription === null) return;
    if (!newDescription.trim()) return showNotice("⚠️ وەسف نابێت بەتاڵ بێت.", "err");

    if (newCode !== code && items.some(x => x.code === newCode)) return showNotice("⚠️ ئەم کۆدە پێشتر هەیە.", "err");

    items = items.filter(x => x.code !== code);
    items.push({ code: newCode, description: newDescription.trim() });
    saveItems();
    showNotice(`✅ نۆزڵی ${newCode} دەستکاری کرا.`);
  }

  $("search").addEventListener("input", render);
  $("clearSearch").addEventListener("click", () => { $("search").value = ""; render(); $("search").focus(); });

  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "nozl-list.json"; a.click();
    URL.revokeObjectURL(url);
    showNotice("⬇️ لیستەکە دەرکرا.");
  });

  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!Array.isArray(parsed)) throw new Error("not array");
      const cleaned = parsed.filter(x => x && typeof x.code === "string" && typeof x.description === "string" && validCode(normalizeCode(x.code)))
        .map(x => ({code:normalizeCode(x.code), description:x.description}));
      if (!confirm(`${cleaned.length} نۆزڵ بهێنرێتە ناو لیستەکە؟ ئەمە لیستی ئێستا دەگۆڕێت.`)) return;
      items = cleaned;
      saveItems();
      showNotice(`✅ ${items.length} نۆزڵ هێنرانە ناو لیستەکە.`);
    } catch {
      showNotice("❌ فایلەکە دروست نییە یان JSON نییە.", "err");
    } finally { event.target.value = ""; }
  });

  render();
})();
</script>
</body>
</html>
